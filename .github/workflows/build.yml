name: Build workerd arm64 (Android Bionic)

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      workerd_ref:
        description: "workerd git tag to build (e.g. v1.20261110.1)"
        required: true
        default: "v1.20261110.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      REF: ${{ inputs.workerd_ref || 'v1.20261110.1' }}
      CACHE_KEY: bazel-android-arm64-${{ inputs.workerd_ref || 'v1.20261110.1' }}-${{ github.run_id }}
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/julia* || true
          docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Checkout workerd-android Repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Checkout cloudflare/workerd@${{ env.REF }}
        uses: actions/checkout@v4
        with:
          repository: cloudflare/workerd
          ref: ${{ env.REF }}
          fetch-depth: 1
          show-progress: false

      - name: Apply Android Bionic patch
        run: |
          git apply --verbose "$GITHUB_WORKSPACE/repo/patches/workerd-android-bionic.patch"

      - name: Set up toolchain (workerd setup-runner)
        uses: ./.github/actions/setup-runner
        with:
          GOOGLESOURCE_COOKIE: ''

      - name: Install bazelisk
        run: |
          sudo curl -fsSL -o /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-arm64
          sudo chmod +x /usr/local/bin/bazel
          echo "wanted bazel: $(cat .bazelversion)"; bazel --version
          nproc; free -g; df -h /

      - name: Restore Bazel disk cache
        uses: actions/cache/restore@v4
        with:
          path: ~/bazel-disk-cache
          key: ${{ env.CACHE_KEY }}
          restore-keys: |
            bazel-android-arm64-${{ env.REF }}-
            bazel-android-arm64-

      - name: Bazel build //src/workerd/server:workerd (No TCMalloc)
        timeout-minutes: 320
        run: |
          bazel build \
            --config=ci --config=release_linux --strip=always \
            --jobs=HOST_CPUS \
            --@workerd//src/workerd/server:use_tcmalloc=False \
            //src/workerd/server:workerd

      - name: Save Bazel disk cache
        if: always()
        run: |
          [ -d ~/bazel-disk-cache ] && find ~/bazel-disk-cache -size +100M -type f -delete || true
          du -sh ~/bazel-disk-cache || true

      - if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/bazel-disk-cache
          key: ${{ env.CACHE_KEY }}

      - name: Verify binary and 39-bit VA compliance
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          cp bazel-bin/src/workerd/server/workerd "$RUNNER_TEMP/artifacts/workerd"
          chmod +x "$RUNNER_TEMP/artifacts/workerd"
          strip "$RUNNER_TEMP/artifacts/workerd" || true
          
          # Assert TCMalloc symbols are completely eliminated
          if strings "$RUNNER_TEMP/artifacts/workerd" | grep -q MmapAligned; then
            echo "::error::TCMalloc still linked in binary!"
            exit 1
          fi
          echo "[+] Verified: TCMalloc successfully omitted."

          # Run full test suite with 39-bit VA emulation shim
          bash "$GITHUB_WORKSPACE/repo/tests/run-tests.sh" "$RUNNER_TEMP/artifacts/workerd"

      - name: Package Release Assets
        run: |
          cd "$RUNNER_TEMP/artifacts"
          tar -czvf workerd-android-arm64.tar.gz workerd
          sha256sum workerd workerd-android-arm64.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.REF }}"
          NOTES="### Cloudflare workerd Native Android ARM64 Release ($TAG)

- Built natively for **Android ARM64 inside Termux** without PRoot or Glibc.
- **TCMalloc disabled** (\`use_tcmalloc=False\`): Resolves kernel aborts on 39-bit Virtual Address (VA) space (\`CONFIG_ARM64_VA_BITS=39\`).
- Verified with embedded SQLite and Durable Objects under emulated 39-bit address limits.
- Upstream source: [cloudflare/workerd@$TAG](https://github.com/cloudflare/workerd/releases/tag/$TAG)

#### Quick Install in Termux:
\`\`\`bash
curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
\`\`\`"

          gh release create "$TAG" \
            "$RUNNER_TEMP/artifacts/workerd-android-arm64.tar.gz" \
            "$RUNNER_TEMP/artifacts/workerd" \
            "$RUNNER_TEMP/artifacts/SHA256SUMS" \
            -R "${{ github.repository }}" \
            --title "workerd $TAG (Android ARM64 Bionic)" \
            --notes "$NOTES" \
          || gh release upload "$TAG" \
            "$RUNNER_TEMP/artifacts/workerd-android-arm64.tar.gz" \
            "$RUNNER_TEMP/artifacts/workerd" \
            "$RUNNER_TEMP/artifacts/SHA256SUMS" \
            -R "${{ github.repository }}" --clobber
