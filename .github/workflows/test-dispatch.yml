name: test-zig-cross

on:
  workflow_dispatch:

jobs:
  test-zig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install latest Zig
        run: |
          ARCH=$(uname -m)
          ZIG_URL=$(python3 -c "import urllib.request, json; data = json.loads(urllib.request.urlopen('https://ziglang.org/download/index.json').read()); print(data['master']['$ARCH-linux']['tarball'])")
          sudo mkdir -p /opt/zig
          curl -fsSL "$ZIG_URL" | sudo tar -xJ --strip-components=1 -C /opt/zig
          echo "/opt/zig" >> "$GITHUB_PATH"
      - name: Test Zig cross-compilation
        run: |
          export PATH="/opt/zig:$PATH"
          echo '#include <stdio.h>' > hello.c
          echo 'int main() { printf("Hello from Zig ARM64!\\n"); return 0; }' >> hello.c

          echo "=== 1. Zig compile with static musl (fully standalone ARM64) ==="
          zig cc -target aarch64-linux-musl -O2 hello.c -o hello-musl
          file hello-musl

          echo "=== 2. Generate Zig libc config for Android NDK ==="
          NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* | tail -n 1)
          SYSROOT="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          cat << LIBC > android-libc.txt
          include_dir=$SYSROOT/usr/include
          sys_include_dir=$SYSROOT/usr/include/aarch64-linux-android
          crt_dir=$SYSROOT/usr/lib/aarch64-linux-android/29
          msvc_lib_dir=
          kernel_tu_dir=
          gcc_dir=
          LIBC
          sed -i 's/^ *//' android-libc.txt
          cat android-libc.txt

          echo "=== 3. Zig compile with Android Bionic libc ==="
          zig cc -target aarch64-linux-android -libc android-libc.txt -O2 hello.c -o hello-bionic
          file hello-bionic
          readelf -l hello-bionic | grep interpreter || true
